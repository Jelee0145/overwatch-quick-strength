<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>守望工具箱</title></head>
<body class="toolkit cloud-pending">
<header class="toolkit-header"><a class="toolkit-brand" href="/">{{SITE_MARK}}<span>守望工具箱</span></a><div class="toolkit-account"><span id="cloudIdentity">连接账号…</span><button id="apiKeyOpen" type="button">API</button><button id="changelogOpen" type="button">更新日志</button><button id="cloudLogout" type="button">退出</button></div></header>
<p id="sessionError" class="session-error" role="alert" hidden></p>
<main class="toolkit-main">
<section class="hub-intro"><h1>工具箱</h1></section>
<section class="tool-grid" aria-label="工具入口">
<a class="tool-entry analysis-entry" href="/tools/strength"><div class="tool-art cover-art analysis-cover" aria-hidden="true"><img loading="lazy" src="{{ANALYSIS_COVER}}" alt=""></div><div class="tool-copy"><h2>对局强度分析 <span aria-hidden="true">↗</span></h2></div></a>
<a class="tool-entry draw-entry" href="/tools/draw"><div class="tool-art cover-art draw-cover" aria-hidden="true"><img loading="lazy" src="{{DRAW_COVER}}" alt=""></div><div class="tool-copy"><h2>英雄抽取 <span aria-hidden="true">↗</span></h2></div></a>
<a class="tool-entry events-entry" href="/tools/events"><div class="tool-art cover-art events-cover" aria-hidden="true"><img loading="lazy" src="{{EVENTS_COVER}}" alt=""></div><div class="tool-copy"><h2>赛事中心 <span aria-hidden="true">↗</span></h2></div></a>
</section>
<footer class="toolkit-footer"><span>非官方社区工具</span></footer>
</main>{{CHANGELOG}}</body></html>
