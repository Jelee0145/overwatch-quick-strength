<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩家管理 · 快速强度图</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/cloud.css"></head><body><section id="login" class="auth-shell"><h1>玩家管理</h1><form id="adminLogin"><label>管理员密码<input id="adminPassword" type="password" autocomplete="current-password" required minlength="10" maxlength="128"></label><button type="submit" class="primary">进入后台</button></form></section><main id="panel" class="admin-shell" hidden><div class="admin-toolbar"><div><h1>待处理玩家</h1><p class="hint">核验本人后批准访问或生成重置链接。</p></div><div><button id="reload">刷新列表</button><button id="adminLogout">退出管理</button></div></div><section id="queryControl" class="admin-section" hidden><h2 id="queryState">查询状态</h2><p id="queryMode"></p><p id="queryCheck" class="hint" role="status"></p><div id="queryActions"></div></section><label class="admin-filter">搜索邮箱<input id="search" type="search" placeholder="输入邮箱查找"></label><section class="admin-section"><h2 id="pendingTitle">等待批准</h2><div id="pending"></div></section><section class="admin-section"><h2 id="resetTitle">密码重置申请</h2><div id="resetUsers"></div></section><section class="admin-section"><h2>已授权及其他玩家</h2><div id="members"></div></section></main><p id="adminMessage" class="auth-status admin-shell" role="status"></p><dialog id="resetDialog"><h2>一次性密码重置链接</h2><p>请手动发送给已核验的本人，30 分钟内有效。旧登录会话已撤销。</p><input id="resetLink" class="reset-link" readonly><button id="copyLink">复制链接</button><button id="closeDialog">关闭</button></dialog><script src="/admin.js"></script></body></html>
