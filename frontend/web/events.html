<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>赛事中心 · 守望工具箱</title></head>
<body class="toolkit events-page cloud-pending">
<header class="toolkit-header"><a class="toolkit-brand" href="/">{{SITE_MARK}}<span>守望工具箱</span></a><div class="toolkit-account"><span id="cloudIdentity">连接账号…</span><button id="apiKeyOpen" type="button">API</button><button id="changelogOpen" type="button">更新日志</button><button id="cloudLogout" type="button">退出</button></div></header>
<p id="sessionError" class="session-error" role="alert" hidden></p>
<main class="toolkit-main events-main">
<a class="back-link" href="/">← 返回工具箱</a>
<section class="events-heading"><div><h1>赛事中心</h1></div><button id="eventsRefresh" type="button">刷新赛程</button></section>
<section class="events-reminders" aria-labelledby="eventsRemindersHeading">
<div class="events-reminders-heading"><div><h2 id="eventsRemindersHeading">我的预约</h2><p id="eventsRemindersStatus" role="status">读取中…</p></div><button id="eventsEnableNotifications" type="button" disabled>启用本机通知</button></div>
<p id="eventsRemindersError" class="events-notice" role="alert" hidden></p>
<ul id="eventsReservations" class="events-reservations" aria-label="已预约的比赛" aria-busy="true"></ul>
</section>
<div class="events-tabs" role="group" aria-label="比赛类型"><button type="button" data-view="scheduled" aria-pressed="true">近期赛程</button><button type="button" data-view="completed" aria-pressed="false">近期赛果</button><span>北京时间</span></div>
<form id="eventsFilters" class="events-filters" aria-label="筛选比赛">
<fieldset class="events-dates"><legend>比赛日期</legend><label><span class="events-sr-only">开始日期</span><input id="eventsFrom" type="date" aria-label="开始日期"></label><span aria-hidden="true">—</span><label><span class="events-sr-only">结束日期</span><input id="eventsTo" type="date" aria-label="结束日期"></label></fieldset>
<label>赛事<select id="eventsSeries"><option value="owcs" selected>OWCS</option><option value="all">全部赛事</option></select></label>
<label>阶段<select id="eventsTournament"><option value="">全部阶段</option></select></label>
<label>赛区<select id="eventsRegion"><option value="">全部赛区</option></select></label>
<label>战队<input id="eventsTeam" type="search" placeholder="名称或简称" maxlength="160"></label>
<div class="events-filter-actions"><button id="eventsApply" type="submit">查询</button><button id="eventsClear" type="button">重置筛选</button></div>
</form>
<p id="eventsNotice" class="events-notice" role="status" hidden></p>
<div class="events-summary"><span id="eventsCount" aria-live="polite"></span><span id="eventsUpdated"></span></div>
<section id="eventsList" class="events-list" aria-label="比赛列表" aria-busy="true"><p class="events-empty">正在获取赛程…</p></section>
<footer class="events-source"><a href="https://liquipedia.net/overwatch/Liquipedia:Matches" target="_blank" rel="noopener noreferrer">Liquipedia</a><a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a></footer>
</main>{{CHANGELOG}}</body></html>
