server {
    listen 8443 ssl;
    server_name 106.55.47.68;
    ssl_certificate /etc/letsencrypt/live/106.55.47.68/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/106.55.47.68/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 3m;
    # The app serves JS as text/javascript; gzip_proxied is required for proxied responses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json text/xml application/xml application/rss+xml image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
