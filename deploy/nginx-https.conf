# Include in nginx's http context. Web and backend share this HTTPS origin;
# PUBLIC_ORIGIN must be https://106.55.47.68:8443 (including the port).
map $uri $owqs_cache_policy {
    default "no-store";
    "~^/static/[a-zA-Z0-9_-]+\.[a-f0-9]{16}\.(js|css|svg|json)$" "public, max-age=31536000, immutable";
    "~^/media/(maps|icons)/[a-f0-9]{20}\.webp$" "public, max-age=31536000, immutable";
    "~^/media/(heroes|covers)/[a-z0-9-]+\.[a-f0-9]{16}\.(png|webp)$" "public, max-age=31536000, immutable";
}
server {
    listen 8443 ssl;
    server_name 106.55.47.68;
    ssl_certificate /etc/letsencrypt/live/106.55.47.68/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/106.55.47.68/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/owqs-work/public;
    index index.html;
    client_max_body_size 3m;
    add_header Cache-Control $owqs_cache_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json text/xml application/xml application/rss+xml image/svg+xml;

    # This read-only authorization probe never refreshes sessions or writes cookies.
    location = /_owqs_page_session {
        internal;
        proxy_pass http://127.0.0.1:8788/api/internal/page-session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
    }
    location = /api/internal/page-session { return 404; }
    location = /api { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 60s;
        proxy_cache off;
    }
    # Login/reset and the separate administrator login form must be reachable anonymously.
    location = /login { try_files /login.html =404; }
    location = /reset { try_files /login.html =404; }
    location = /login.html { try_files $uri =404; }
    location = /admin { try_files /admin.html =404; }
    location = /admin.html { try_files $uri =404; }
    location ~ (^|/)[._] { return 404; }
    location ~ ^/(static|media)/ { try_files $uri =404; }
    location ~ ^/(install\.js|event-reminders-sw\.js|manifest\.json|app-icon\.svg|release-notes\.json)$ { try_files $uri =404; }
    location = /tools/strength/ { return 308 /tools/strength; }
    location = /tools/draw/ { return 308 /tools/draw; }
    location = /tools/events/ { return 308 /tools/events; }
    location = /tools/strength { auth_request /_owqs_page_session; error_page 401 = @page_login; try_files /tools/strength.html =404; }
    location = /tools/draw { auth_request /_owqs_page_session; error_page 401 = @page_login; try_files /tools/draw.html =404; }
    location = /tools/events { auth_request /_owqs_page_session; error_page 401 = @page_login; try_files /tools/events.html =404; }
    location / {
        auth_request /_owqs_page_session;
        error_page 401 = @page_login;
        try_files $uri $uri/ =404;
    }
    # $uri deliberately excludes query strings; next stays a same-origin page path.
    location @page_login { return 302 /login?next=$uri; }
}
