<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>英雄抽取 · 守望工具箱</title></head>
<body class="toolkit cloud-pending">
<header class="toolkit-header"><a class="toolkit-brand" href="/">{{SITE_MARK}}<span>守望工具箱</span></a><div class="toolkit-account"><span id="cloudIdentity">连接账号…</span><button id="apiKeyOpen" type="button">API</button><button id="changelogOpen" type="button">更新日志</button><button id="cloudLogout" type="button">退出</button></div></header>
<p id="sessionError" class="session-error" role="alert" hidden></p>
<main class="toolkit-main draw-main">
<a class="back-link" href="/">← 返回工具箱</a>
<section class="draw-heading"><h1>英雄抽取</h1><button id="historyOpen" class="secondary-button" type="button">抽取记录 <span id="historyCount">0</span></button></section>
<div class="mode-switch" role="group" aria-label="抽取形式"><button type="button" data-mode="wheel" aria-pressed="true">轮盘</button><button type="button" data-mode="card" aria-pressed="false">抽卡</button><button type="button" data-mode="slot" aria-pressed="false">老虎机</button></div>
<section id="drawStage" class="draw-stage" data-mode="wheel" aria-label="英雄抽取展示">
<span id="stagePool" hidden></span>
<div id="wheelView" class="wheel-view"><div class="wheel-indicator" aria-hidden="true"></div><div id="wheelTrack" class="wheel-track"></div><div class="wheel-focus" aria-hidden="true"></div></div>
<div id="cardView" class="card-view" hidden><div id="heroCard" class="hero-card"><div class="card-face card-back">{{OW_MARK}}<i aria-hidden="true">?</i></div><div class="card-face card-front"><img id="cardPortrait" alt=""><strong id="cardName"></strong><small id="cardRole"></small></div></div></div>
<div id="slotView" class="slot-view" hidden><div class="slot-machine"><div class="slot-window slot-emblem" aria-hidden="true">{{OW_MARK}}</div><div class="slot-window slot-center"><div id="slotTrack" class="slot-track"></div><div class="slot-scan" aria-hidden="true"></div></div><div class="slot-window slot-emblem" aria-hidden="true">{{OW_MARK}}</div></div></div>
</section>
<section class="draw-controls" aria-label="抽取设置"><div class="role-switch" role="group" aria-label="英雄职责"><button type="button" data-role="all" aria-pressed="true">全部</button><button type="button" data-role="重装" aria-pressed="false">重装</button><button type="button" data-role="输出" aria-pressed="false">输出</button><button type="button" data-role="支援" aria-pressed="false">支援</button></div><p id="poolCount" class="pool-count"></p><button id="drawButton" class="draw-button" type="button" disabled><span>开始抽取</span><span aria-hidden="true">↗</span></button><div id="drawResult" class="draw-result" role="status" aria-live="polite"><p id="resultHint"></p><strong id="resultName"></strong><span id="resultRole"></span></div></section>
<footer class="toolkit-footer"><span>非官方社区工具</span></footer>
</main>
<dialog id="drawHistory" class="draw-history"><div class="history-heading"><h2>抽取记录</h2><button id="historyClose" type="button" aria-label="关闭抽取记录">✕</button></div><ol id="drawHistoryList"></ol><p id="historyEmpty">暂无记录</p><button id="clearDrawHistory" type="button">清空记录</button></dialog>
{{CHANGELOG}}</body></html>
