<dialog id="apiKeyDialog" class="api-key-dialog" aria-labelledby="apiKeyTitle">
  <h2 id="apiKeyTitle">API 密钥</h2>
  <p id="apiKeyStatus" class="hint" role="status">正在读取…</p>
  <div class="api-key-row">
    <input id="apiKeyValue" type="password" readonly autocomplete="off" spellcheck="false" aria-label="API 密钥">
    <button id="apiKeyReveal" type="button">查看</button>
    <button id="apiKeyCopy" type="button">复制</button>
  </div>
  <div class="api-key-actions">
    <button id="apiKeyRegenerate" type="button">生成密钥</button>
    <button id="apiKeyClose" type="button">关闭</button>
  </div>
</dialog>
