<dialog id="changelogDialog" class="changelog-dialog" aria-labelledby="changelogTitle">
  <p id="changelogVersion" class="changelog-version"></p>
  <h2 id="changelogTitle">更新日志</h2>
  <div id="changelogEntries"></div>
  <p class="hint">每次功能更新或问题修复均会提示未读版本。点击“我知道了”后，此账号在当前浏览器不再自动弹出该版本；右上角可随时重看。</p>
  <p id="changelogNotice" role="status" class="hint"></p>
  <button id="changelogAcknowledge" type="button" class="full">我知道了</button>
</dialog>
