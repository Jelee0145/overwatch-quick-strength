<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>赛事中心 · 守望工具箱</title></head>
<body class="toolkit events-page cloud-pending">
<header class="toolkit-header"><a class="toolkit-brand" href="/">{{SITE_MARK}}<span>守望工具箱<small>OVERWATCH TOOLBOX</small></span></a><div class="toolkit-account"><span id="cloudIdentity">连接账号…</span><button id="apiKeyOpen" type="button">API</button><button id="changelogOpen" type="button">更新日志</button><button id="cloudLogout" type="button">退出</button></div></header>
<p id="sessionError" class="session-error" role="alert" hidden></p>
<main class="toolkit-main events-main">
<a class="back-link" href="/">← 返回工具箱</a>
<section class="events-heading"><div><p class="eyebrow">OWCS</p><h1>赛事中心<span class="events-heading-dot" aria-hidden="true"></span></h1><p>下一场精彩，几点开始？<span>赛程与赛果，一起看。</span></p></div><button id="eventsRefresh" class="secondary-button" type="button">刷新赛程 <span aria-hidden="true">↻</span></button></section>
<div class="events-tabs" role="group" aria-label="比赛类型"><button type="button" data-view="scheduled" aria-pressed="true">近期赛程</button><button type="button" data-view="completed" aria-pressed="false">近期赛果</button><span>北京时间 UTC+8</span></div>
<form id="eventsFilters" class="events-filters" aria-label="筛选比赛">
<fieldset class="events-dates"><legend>比赛日期</legend><label><span class="events-sr-only">开始日期</span><input id="eventsFrom" type="date" aria-label="开始日期"></label><span aria-hidden="true">—</span><label><span class="events-sr-only">结束日期</span><input id="eventsTo" type="date" aria-label="结束日期"></label></fieldset>
<label>赛事<select id="eventsTournament"><option value="">全部赛事</option></select></label>
<label>赛区<select id="eventsRegion"><option value="">全部赛区</option></select></label>
<label>战队<input id="eventsTeam" type="search" placeholder="搜索战队名称或简称" maxlength="160"></label>
<button id="eventsClear" type="button">重置筛选</button>
</form>
<p id="eventsNotice" class="events-notice" role="status" hidden></p>
<div class="events-summary"><span id="eventsCount" aria-live="polite">正在获取比赛…</span><span id="eventsUpdated">每 5 分钟检查更新</span></div>
<section id="eventsList" class="events-list" aria-label="比赛列表" aria-busy="true"><p class="events-empty">正在获取赛程…</p></section>
<footer class="events-source"><p>仅包含数据源当前提供的 OWCS 近期比赛，不代表完整赛季。时间与比分以赛事实际公布为准。</p><p>数据来源：<a href="https://liquipedia.net/overwatch/Liquipedia:Matches" target="_blank" rel="noopener noreferrer">Liquipedia ↗</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a> · 数据经筛选与整理</p></footer>
</main>{{CHANGELOG}}</body></html>
