<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 快速强度图</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/cloud.css"></head><body><section class="auth-shell"><h1>快速强度图</h1><p class="hint">与朋友一起看看，每一场谁在尽力。</p><form id="authForm"><label id="emailLabel">邮箱<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label>密码<input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"></label><div class="auth-actions"><button id="submit" class="primary" type="submit">登录</button><button id="register" type="button">申请账号</button><button id="reset" type="button">申请重置密码</button></div></form><div id="waiting" class="waiting" hidden><h2>等待授权</h2><p id="waitText"></p><button id="refresh">检查授权</button><button id="logout">退出账号</button></div><p id="message" class="auth-status" role="status"></p><a href="/admin" class="hint">管理员入口</a></section><script src="/login.js"></script></body></html>
